name: Go backend

on:
  workflow_dispatch:
  push:
    branches: ['ci/domainshare-go']
  pull_request:
    paths:
      - '.github/workflows/go-backend.yml'
      - 'app/**'
      - 'cmd/**'
      - 'dev/**'
      - 'etc/samba/**'
      - 'internal/**'
      - 'scripts/dev'
      - 'scripts/test-e2e'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'go.mod'
      - 'go.sum'
      - 'setup'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y acl libtiff-tools p7zip-full poppler-utils rclone rsync tesseract-ocr-eng
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/...

  samba:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [go, upgrade, split]
    env:
      DEV_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker compose config --quiet
      - name: Run AD/Samba end-to-end tests
        shell: bash
        run: |
          log="$RUNNER_TEMP/domainshare-e2e.log"
          if ./scripts/test-e2e 2>&1 | tee "$log"; then
            exit 0
          fi

          # Keep the failure visible in the Checks API as well as the job log.
          failure=$(
            grep -E '(^\[e2e\]|^error:)' "$log" | tail -n 12 || true
            awk '/^switching the disposable Python server to Go/{upgrading=1; next} /^===== /{upgrading=0} upgrading' "$log" | tail -n 24
            awk '/^===== [^ ]+-(files|management) =====/{print; found=1; next} /^===== /{found=0} found' "$log" | tail -n 32
          )
          failure=${failure:0:6000}
          failure=${failure//'%'/'%25'}
          failure=${failure//$'\r'/'%0D'}
          failure=${failure//$'\n'/'%0A'}
          printf '::error title=AD/Samba end-to-end test failed::%s\n' "${failure:-See the job log for details.}"
          exit 1
