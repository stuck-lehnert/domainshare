services:
  samba:
    build:
      context: .
    image: domainshare:latest
    pull_policy: never
    container_name: domainshare
    hostname: domainshare
    restart: unless-stopped
    ports:
      - "445:445"
      - "139:139"
      - "80:80"
      - "443:8443"
    volumes:
      - private_data:/data/private
      - fslogix_data:/data/fslogix
      - group_data:/data/groups
      - state_data:/state
      - samba_lib_data:/var/lib/samba
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  private_data:
  fslogix_data:
  group_data:
  state_data:
  samba_lib_data:
